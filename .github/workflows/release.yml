name: Build and Release on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to a commit on master
        id: check_master
        run: |
          git fetch origin master --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.check_master.outputs.on_master == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.check_master.outputs.on_master == 'true' }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        if: ${{ steps.check_master.outputs.on_master == 'true' }}
        run: npm run build

      - name: Create release archive
        if: ${{ steps.check_master.outputs.on_master == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="bootstrap-legacy-${VERSION}.zip"
          cd dist
          zip -r "../${ARCHIVE_NAME}" .
          echo "archive_path=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
        id: archive

      - name: Create GitHub Release and upload asset
        if: ${{ steps.check_master.outputs.on_master == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.archive_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip note (tag not on master)
        if: ${{ steps.check_master.outputs.on_master != 'true' }}
        run: echo "Tag $GITHUB_REF_NAME does not point to a commit on master. Skipping release."


