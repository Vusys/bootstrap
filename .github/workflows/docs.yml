on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build compiled assets
        run: npm run build

      - name: Copy compiled assets into docs site
        run: npm run docs:copy

      - uses: hydephp/action@master
        with:
          debug: true
          directory: 'docs'
          deploy-to: 'pages'
          env: |
            SITE_NAME=Bootstrap
            SITE_URL=https://vusys.github.io/bootstrap