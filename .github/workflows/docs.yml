on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: hydephp/action@master
        with:
          debug: true
          directory: 'docs'
          deploy-to: 'pages'
          env: |
            SITE_NAME=Bootstrap
            SITE_URL=https://vusys.github.io/bootstrap